name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile=false
      # Build first: packages that consume @semagraph/kernel (state64-adapter,
      # renderer-svg) resolve its emitted dist/*.d.ts, which only exist after a
      # build. pnpm -r builds in topological order, so the kernel compiles first.
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test
      - name: Epistemic-compression metrology self-check
        run: node experiments/run-epistemic-compression.mjs
      # Regenerate the parity fixture from the TypeScript reference and fail if it
      # differs from the committed copy. This guarantees the golden file the Rust
      # core is tested against can never silently drift from the reference.
      - run: node packages/state64-adapter/scripts/generate-parity-fixture.mjs
      - name: Verify parity fixture is up to date
        run: git diff --exit-code packages/core-rs/tests/fixtures/transition-parity.json
      - run: node packages/state64-adapter/scripts/generate-shape-parity-fixture.mjs
      - name: Verify shape parity fixture is up to date
        run: git diff --exit-code packages/core-rs/tests/fixtures/shape-parity.json

  rust:
    runs-on: ubuntu-latest
    # The Rust workspace lives in packages/ (members: core-rs, cli). Running from
    # the workspace root makes --workspace cover both the kernel and the CLI.
    defaults:
      run:
        working-directory: packages
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy (workspace)
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Unit and parity tests (workspace)
        run: cargo test --workspace --all-targets
      - name: SIMD equality test
        run: cargo test -p semagraph-core-rs --features simd
      - name: Benches compile
        run: cargo build -p semagraph-core-rs --benches
      - name: CLI builds with no runtime dependencies
        run: cargo build --release -p semagraph
