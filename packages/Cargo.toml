# Rust workspace for the SemaGraph crates.
#
# Members:
#   core-rs  the dependency-free deterministic kernel (library + C ABI).
#   cli      the `semagraph` command-line tool that consumes the kernel.
#
# The release profile lives here because Cargo only honours `[profile.*]` in the
# workspace root; members inherit it.
[workspace]
resolver = "2"
members = ["core-rs", "cli"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
