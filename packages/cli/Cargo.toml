[package]
name = "semagraph"
version = "0.7.0"
edition = "2021"
description = "Deterministic CLI for classifying and compressing state-transition trajectories over a six-bit state alphabet. No inference, no network, no runtime dependencies."
license = "Apache-2.0"
readme = "../../README.md"
repository = "https://github.com/andycruccas92/semagraph-64"
homepage = "https://github.com/andycruccas92/semagraph-64"
categories = ["command-line-utilities"]
keywords = ["state-machine", "trajectory", "deterministic", "compression"]

[[bin]]
name = "semagraph"
path = "src/main.rs"

# DESIGN-NOTE: the CLI deliberately has no third-party dependencies. Argument
# parsing and JSON emission are hand-rolled so the binary keeps the project's
# zero-runtime-dependency promise and stays trivially auditable. The only
# dependency is the in-repo kernel.
# NOTE: crates.io requires a `version` on path dependencies. `semagraph-core-rs`
# must be published to crates.io BEFORE `semagraph`, and this version must match
# the published core-rs version.
[dependencies]
semagraph-core-rs = { path = "../core-rs", version = "0.7.0" }
