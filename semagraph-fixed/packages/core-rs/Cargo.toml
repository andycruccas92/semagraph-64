[package]
name = "semagraph-core-rs"
version = "0.7.0"
edition = "2021"
description = "Rust feasibility core for SemaGraph Q6 / State64 deterministic transition compression."
license = "Apache-2.0"
repository = "https://github.com/OWNER/semagraph"
homepage = "https://github.com/OWNER/semagraph"
readme = "../../README.md"
keywords = ["state-machine", "trajectory", "deterministic", "compression"]
categories = ["algorithms", "data-structures"]

[lib]
name = "semagraph_core_rs"
crate-type = ["rlib", "cdylib", "staticlib"]

[features]
default = []
ffi = []
# Optional explicit-SIMD batch path (x86_64 SSE2) with an always-correct scalar
# fallback. Off by default; the scalar batch path is the source of truth.
simd = []

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "throughput"
harness = false
